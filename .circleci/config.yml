version: 2.1

# Starter pipeline for the sinatra monorepo.
# Three projects, each with its own Gemfile: sinatra (root), sinatra-contrib, rack-protection.
# Note: *.lock is gitignored in this repo, so caches are keyed on the Gemfile/gemspec
# checksums rather than a lockfile.

jobs:
  sinatra:
    docker:
      - image: cimg/ruby:3.4
    steps:
      - checkout
      - restore_cache:
          keys:
            - sinatra-gems-v1-{{ checksum "Gemfile" }}-{{ checksum "sinatra.gemspec" }}-{{ checksum "rack-protection/rack-protection.gemspec" }}-{{ checksum "sinatra-contrib/sinatra-contrib.gemspec" }}
            - sinatra-gems-v1-
      - run:
          name: Install gems
          command: |
            bundle config set --local path vendor/bundle
            bundle install --jobs=4 --retry=3
      - run:
          name: Run sinatra tests
          command: bundle exec rake test:core
      - save_cache:
          key: sinatra-gems-v1-{{ checksum "Gemfile" }}-{{ checksum "sinatra.gemspec" }}-{{ checksum "rack-protection/rack-protection.gemspec" }}-{{ checksum "sinatra-contrib/sinatra-contrib.gemspec" }}
          paths:
            - vendor/bundle

  sinatra-contrib:
    docker:
      - image: cimg/ruby:3.4
    steps:
      - checkout
      - restore_cache:
          keys:
            - sinatra-contrib-gems-v1-{{ checksum "sinatra-contrib/Gemfile" }}-{{ checksum "sinatra-contrib/sinatra-contrib.gemspec" }}-{{ checksum "sinatra.gemspec" }}-{{ checksum "rack-protection/rack-protection.gemspec" }}
            - sinatra-contrib-gems-v1-
      - run:
          name: Install gems
          working_directory: ~/project/sinatra-contrib
          command: |
            bundle config set --local path vendor/bundle
            bundle install --jobs=4 --retry=3
      - run:
          name: Run sinatra-contrib specs
          working_directory: ~/project/sinatra-contrib
          command: bundle exec rake
      - save_cache:
          key: sinatra-contrib-gems-v1-{{ checksum "sinatra-contrib/Gemfile" }}-{{ checksum "sinatra-contrib/sinatra-contrib.gemspec" }}-{{ checksum "sinatra.gemspec" }}-{{ checksum "rack-protection/rack-protection.gemspec" }}
          paths:
            - sinatra-contrib/vendor/bundle

  rack-protection:
    docker:
      - image: cimg/ruby:3.4
    steps:
      - checkout
      - restore_cache:
          keys:
            - rack-protection-gems-v1-{{ checksum "rack-protection/Gemfile" }}-{{ checksum "rack-protection/rack-protection.gemspec" }}
            - rack-protection-gems-v1-
      - run:
          name: Install gems
          working_directory: ~/project/rack-protection
          command: |
            bundle config set --local path vendor/bundle
            bundle install --jobs=4 --retry=3
      - run:
          name: Run rack-protection specs
          working_directory: ~/project/rack-protection
          command: bundle exec rake
      - save_cache:
          key: rack-protection-gems-v1-{{ checksum "rack-protection/Gemfile" }}-{{ checksum "rack-protection/rack-protection.gemspec" }}
          paths:
            - rack-protection/vendor/bundle

workflows:
  test:
    jobs:
      - sinatra
      - sinatra-contrib
      - rack-protection
